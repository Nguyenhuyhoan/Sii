
name: Nightly SideStore Build 👍 Fast

on:
  push:
    branches: [develop, LiveContainerSupport, main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # Tự động chọn cụm máy macOS khả dụng ngay lập tức, không bao giờ lỗi "not supported"
    timeout-minutes: 45
    env:
      DEPLOY_KEY: ${{ secrets.CROSS_REPO_PUSH_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: Nightly
      CHANNEL: nightly
      UPSTREAM_CHANNEL: ""

    steps:
      # 1. Checkout repo chính
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 2. Kiểm tra điều kiện build
      - name: Check Build Conditions
        id: build_gate
        run: |
          LAST_SUCCESSFUL_COMMIT=$(python3 scripts/ci/workflow.py last-successful-commit "false" "${{ env.CHANNEL }}" || echo "")
          echo "LAST_SUCCESSFUL_COMMIT=$LAST_SUCCESSFUL_COMMIT" | tee -a "$GITHUB_ENV"

          SHOULD_SKIP="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NEW_COMMITS=$(python3 scripts/ci/workflow.py count-new-commits "$LAST_SUCCESSFUL_COMMIT" || echo "1")
            echo "NEW_COMMITS=$NEW_COMMITS" | tee -a "$GITHUB_ENV"
            if [ "${NEW_COMMITS:-0}" -lt 1 ]; then
              SHOULD_SKIP="true"
            fi
          fi
          echo "should_skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"

      # 3. Tải Submodules đa luồng (8 luồng song song)
      - name: Checkout Submodules (Fast Parallel)
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          git config --global protocol.version 2
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      # 4. Tải trực tiếp Binary theo đúng kiến trúc CPU (arm64 / x86_64)
      - name: Install Dependencies (Fast)
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            LDID_ASSET="ldid_macos_arm64"
          else
            LDID_ASSET="ldid_macos_x86_64"
          fi

          curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/${LDID_ASSET}" -o "$HOME/.local/bin/ldid" &
          curl -fsSL "https://github.com/cpisciotta/xcbeautify/releases/latest/download/xcbeautify-universal-apple-macosx.zip" -o /tmp/xcbeautify.zip &
          wait

          chmod +x "$HOME/.local/bin/ldid"
          unzip -q -o /tmp/xcbeautify.zip -d "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/xcbeautify"

      # --------------------------------------------------
      # Runtime Env Setup
      # --------------------------------------------------
      - name: Setup Env
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)

          NORMALIZED_VERSION=$(python3 scripts/ci/workflow.py compute-normalized \
              "$MARKETING_VERSION" \
              "$BUILD_NUM" \
              "$SHORT_COMMIT")

          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a "$GITHUB_ENV"
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a "$GITHUB_ENV"
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a "$GITHUB_ENV"

      - name: Setup Xcode
        if: steps.build_gate.outputs.should_skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "latest-stable"

      # 5. Cache Xcode DerivedData & SPM
      - name: Cache Xcode DerivedData & SPM
        if: steps.build_gate.outputs.should_skip != 'true' && !contains(github.event.head_commit.message, '[--clean-build]')
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: xcode-build-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.xcodeproj/project.pbxproj', '**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-build-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.xcodeproj/project.pbxproj', '**/Package.resolved') }}-
            xcode-build-cache-${{ runner.os }}-${{ github.ref_name }}-

      # --------------------------------------------------
      # Build and Test
      # --------------------------------------------------
      - name: Clean
        if: steps.build_gate.outputs.should_skip != 'true' && contains(github.event.head_commit.message, '[--clean-build]')
        run: |
          python3 scripts/ci/workflow.py clean
          python3 scripts/ci/workflow.py clean-derived-data
          python3 scripts/ci/workflow.py clean-spm-cache

      # 6. Pre-populate SPM Artifacts & Boot Simulator
      - name: Pre-populate Artifacts & Boot Sim
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          if [ "${{ vars.ENABLE_TESTS }}" = "1" ] && [ "${{ vars.ENABLE_TESTS_RUN }}" = "1" ]; then
            mkdir -p build/logs
            python3 scripts/ci/workflow.py boot-sim-async "iPhone 16 Pro" &
          fi

          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"

          OPENSSL_FILE="$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          if [ ! -f "$OPENSSL_FILE" ]; then
            curl -fsSL "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" -o "$OPENSSL_FILE" &
          fi

          UNICORN_FILE="$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"
          if [ ! -f "$UNICORN_FILE" ]; then
            curl -fsSL "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip" -o "$UNICORN_FILE" &
          fi

          wait

      - name: Build
        if: steps.build_gate.outputs.should_skip != 'true'
        id: build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          set +e
          python3 scripts/ci/workflow.py build
          STATUS=$?
          set -e
          if [ -n "$BUILD_LOG_ZIP_PASSWORD" ]; then
            python3 scripts/ci/workflow.py encrypt-build || true
            echo "encrypted=true" >> "$GITHUB_OUTPUT"
          fi
          exit $STATUS

      - name: Tests Build
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        id: test-build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          set +e
          python3 scripts/ci/workflow.py tests-build
          STATUS=$?
          set -e
          if [ -n "$BUILD_LOG_ZIP_PASSWORD" ]; then
            python3 scripts/ci/workflow.py encrypt-tests-build || true
          fi
          exit $STATUS

      - name: Tests Run
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        id: test-run
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          set +e
          python3 scripts/ci/workflow.py tests-run "iPhone 16 Pro"
          STATUS=$?
          set -e
          if [ -n "$BUILD_LOG_ZIP_PASSWORD" ]; then
            python3 scripts/ci/workflow.py encrypt-tests-run || true
          fi
          exit $STATUS

      # --------------------------------------------------
      # Artifacts
      # --------------------------------------------------
      - uses: actions/upload-artifact@v4
        if: always() && steps.build_gate.outputs.should_skip != 'true' && steps.build.outputs.encrypted == 'true'
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}.zip
          path: build-logs.zip
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: >
          always() &&
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        with:
          name: tests-build-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-build-logs.zip
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: >
          always() &&
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        with:
          name: tests-run-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-run-logs.zip
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore.ipa
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: SideStore.dSYMs.zip
          if-no-files-found: ignore
          compression-level: 0

      # --------------------------------------------------
      # Deploy & Release
      # --------------------------------------------------
      - uses: actions/checkout@v4
        if: steps.build_gate.outputs.should_skip != 'true' && env.DEPLOY_KEY != ''
        with:
          repository: "SideStore/apps-v2.json"
          ref: "main"
          token: ${{ secrets.CROSS_REPO_PUSH_KEY }}
          path: "SideStore/apps-v2.json"
          fetch-depth: 1

      - name: Generate Metadata & Deploy
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          python3 scripts/ci/workflow.py dump-project-settings
          PRODUCT_NAME=$(python3 scripts/ci/workflow.py read-product-name)
          BUNDLE_ID=$(python3 scripts/ci/workflow.py read-bundle-id)
          IPA_NAME="$PRODUCT_NAME.ipa"

          python3 scripts/ci/workflow.py generate-metadata \
            "$CHANNEL" \
            "$SHORT_COMMIT" \
            "$MARKETING_VERSION" \
            "$CHANNEL" \
            "$BUNDLE_ID" \
            "$IPA_NAME" \
            "$LAST_SUCCESSFUL_COMMIT"

          if [ -n "$DEPLOY_KEY" ]; then
            SOURCE_JSON="_includes/source.json"
            python3 scripts/ci/workflow.py deploy \
              SideStore/apps-v2.json \
              "$SOURCE_JSON" \
              "$CHANNEL" \
              "$MARKETING_VERSION"
          fi

      - name: Upload Release
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          python3 scripts/ci/workflow.py upload-release \
            "$RELEASE_NAME" \
            "$CHANNEL" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$UPSTREAM_CHANNEL"
