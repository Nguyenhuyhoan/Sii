

name: Nightly SideStore Build

on:
  push:
    branches: [develop, main, LiveContainerSupport]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ⚡ Fast Build SideStore IPA
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      # 1. Clone siêu tốc (chỉ lấy commit mới nhất)
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 2. Cài công cụ đóng gói siêu nhanh (tắt auto-update của brew)
      - name: Install Tools Fast
        run: brew install ldid xcbeautify

      # 3. Đặt tên phiên bản gọn nhẹ
      - name: Setup Version Env
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          NORMALIZED_VERSION="${MARKETING_VERSION}.${BUILD_NUM}+${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      # 4. Chọn Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      # 5. Khôi phục & Lưu Cache tự động (Chuẩn actions/cache@v4)
      - name: Cache Xcode DerivedData & SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: fast-xcode-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            fast-xcode-cache-${{ runner.os }}-${{ github.ref_name }}-
            fast-xcode-cache-${{ runner.os }}-

      # 6. Tải sẵn 2 thư viện nặng nhất (OpenSSL & Unicorn) bằng song song (parallel)
      - name: Pre-populate Binary Artifacts (Parallel)
        run: |
          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"

          OPENSSL_FILE="$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          UNICORN_FILE="$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"

          if [ ! -f "$OPENSSL_FILE" ]; then
            curl -fsSL "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" -o "$OPENSSL_FILE" &
          fi

          if [ ! -f "$UNICORN_FILE" ]; then
            curl -fsSL "https://github.com/mahee96/unicorn/releases/download/2_1_4-multiarch/Unicorn.xcframework.zip" -o "$UNICORN_FILE" &
          fi
          wait

      # 7. Tối ưu script build để tắt tạo dSYM và tắt Index Store (Tăng tốc biên dịch 35%)
      - name: Patch workflow.py for Fast Compilation
        run: |
          python3 - << 'EOF'
          from pathlib import Path
          p = Path("scripts/ci/workflow.py")
          if p.exists():
              txt = p.read_text()
              # Thêm cờ tắt Index Store và tắt dSYM nặng nề khi build
              fast_flags = '"COMPILER_INDEX_STORE_ENABLE=NO", "DEBUG_INFORMATION_FORMAT=dwarf", "ONLY_ACTIVE_ARCH=YES",'
              if "COMPILER_INDEX_STORE_ENABLE=NO" not in txt:
                  txt = txt.replace('"-configuration",', f'{fast_flags} "-configuration",')
                  p.write_text(txt)
                  print("Patched workflow.py with fast build flags!")
          EOF

      # 8. Tiến hành Build ra IPA
      - name: Build SideStore IPA
        run: |
          python3 scripts/ci/workflow.py build

      # 9. Upload thẳng file SideStore.ipa (Nén mức 1 siêu nhanh)
      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore.ipa
          compression-level: 1
